name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r windows/requirements.txt pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name ItamarOS-iPhone-Studio windows/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ItamarOS-iPhone-Studio-Windows-EXE
          path: dist/ItamarOS-iPhone-Studio.exe
