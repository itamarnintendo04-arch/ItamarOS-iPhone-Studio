name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Windows Python source
        run: python -m py_compile windows/main.py
      - name: Install build dependencies
        run: python -m pip install -r windows/requirements.txt pyinstaller
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ItamarOS-iPhone-Studio --collect-all customtkinter windows/main.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ItamarOS-iPhone-Studio-Windows-EXE
          path: dist/ItamarOS-iPhone-Studio.exe
          if-no-files-found: error
